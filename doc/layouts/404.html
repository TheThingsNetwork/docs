{{ define "main" }}
<main id="main" class="dx-home">
  <section class="dx-home__hero dx-home__hero--404">
    <div class="dx-wrap">
      <div class="dx-eyebrow">404</div>
      <h1 class="dx-title">{{ .Title | default "Page not found" }}</h1>
      <p class="dx-home__sub">This page does not exist (anymore). Try the search above, or start from the docs home.</p>
      <div class="dx-actions">
        <a class="dx-btn dx-btn--primary" href="{{ site.Home.RelPermalink }}">Docs home {{ partial "site/icon.html" (dict "n" "arrow-right") }}</a>
      </div>
      {{ with .Content }}<div class="dx-prose">{{ . }}</div>{{ end }}
    </div>
  </section>
</main>
{{ end }}
