name: Pull request

on: pull_request

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-20.04
    steps:
    - name: Check out code
      uses: actions/checkout@v3
    - name: Set up Go
      uses: actions/setup-go@v3
      with:
        go-version: '~1.17'
    - name: Get Go module cache directory path
      id: go-module-cache-dir-path
      run: echo "dir=$(go env GOMODCACHE)" >> $GITHUB_OUTPUT
    - name: Initialize Go module cache
      uses: actions/cache@v3
      with:
        path: ${{ steps.go-module-cache-dir-path.outputs.dir }}
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
    - name: Download Go dependencies
      run: make go.deps
    - name: Initialize Hugo binary cache
      id: cache-hugo
      uses: actions/cache@v3
      with:
        path: hugo.linux
        key: ${{ runner.os }}-hugo-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-hugo-
    - name: Build Hugo binary
      if: steps.cache-hugo.outputs.cache-hit != 'true'
      run: make hugo.linux
    - name: Build docs
      run: make build.public
      env:
        HUGO: ./hugo.linux
        HUGO_BASE_URL: https://www.thethingsnetwork.org/docs
